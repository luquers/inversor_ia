# ============================================================
#  Configuración del asistente de inversión
#  Fórmula Mágica (Greenblatt) + filtro F-Score (Piotroski)
# ============================================================

# La SEC exige identificarse con un email para descargar sus datos (solo se usa para eso).
# En GitHub se configura como secreto (SEC_CONTACTO) y esto se deja vacío.
sec_contacto: ""

# Qué empresas analizar:
#   sp500   -> las 500 grandes de EE. UU. (más rápido)
#   sp1500  -> S&P 500 + 400 + 600: grandes, medianas y pequeñas (recomendado)
#   archivo -> usa tu propia lista en tickers.csv
universo: sp1500

# Greenblatt excluye bancos, aseguradoras y eléctricas porque sus balances
# no encajan en la fórmula. Las inmobiliarias (REITs) iban dentro de "financieras".
sectores_excluidos: [Financials, Utilities, Real Estate]

# Tamaño mínimo de empresa (capitalización en dólares). Evita empresas diminutas.
capitalizacion_minima: 300000000

# Filtro de calidad de Piotroski (0 a 9). Se descartan las empresas por debajo.
# Pon 0 para usar solo la Fórmula Mágica.
fscore_minimo: 5

# Reglas de la cartera (se copian en cada cartera simulada al crearla)
cartera:
  num_posiciones: 20            # Greenblatt recomienda 20-30 empresas
  compras_por_tanda: 5          # cuántas compras como máximo en cada revisión
  frecuencia_meses: 3           # cada cuánto se revisa la cartera
  mantener_dias: 365            # cuánto se mantiene cada acción
  renovar_si_sigue_en_lista: true   # si al cumplir el año sigue entre las mejores, se queda
  acciones_fraccionadas: false  # true si tu bróker permite comprar fracciones de acción
  comision_pct: 0.001           # 0,1 % por operación
  comision_minima: 1.0          # en dólares

# Estilo alternativo "diaria": se usa al crear una cartera con estilo diaria.
# Parte de las reglas de "cartera" y cambia solo lo que se indica aquí:
#   - se revisa cada día de mercado (frecuencia_meses y mantener_dias no se usan)
#   - compra empresas que están entre las num_posiciones mejores, si hay hueco
#   - vende en cuanto una empresa cae fuera de las vender_fuera_del_top mejores
#     o deja de pasar el filtro de F-Score
cartera_diaria:
  compras_por_tanda: 20         # puede llenar los huecos el mismo día
  vender_fuera_del_top: 50      # margen para no comprar y vender por pequeños movimientos de precio

# Índice con el que compararte
referencia: SPY

datos:
  cache_dias: 7                 # cada cuántos días se vuelven a descargar las cuentas de la SEC
  pausa_segundos: 0.15          # pausa entre descargas (la SEC admite hasta 10 por segundo)

alertas:
  dia_informe: 0                # día del informe semanal (0 = lunes ... 6 = domingo)
  top_informe: 15               # cuántas empresas mostrar en el informe
  mis_acciones: []              # acciones que tienes de verdad, para vigilarlas. Ej: [AAPL, MSFT]

web:
  activo: true                  # genera el panel para el móvil en la carpeta docs/
  url_panel: "https://luquers.github.io/inversor_ia/"               # cuando lo publiques, pon aquí su dirección para que salga en Telegram
