name: Actualización diaria

on:
  schedule:
    - cron: "30 22 * * 1-5"   # de lunes a viernes, 22:30 UTC (tras el cierre de Wall Street)
    - cron: "15 15-20 * * 1-5"  # cada hora durante la sesión: vigilancia de la cartera reactiva
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inversor
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar los datos ya descargados
        if: github.event.schedule != '15 15-20 * * 1-5'
        uses: actions/cache@v4
        with:
          path: cache
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Actualizar carteras, parte diario y panel (o vigilar durante la sesión)
        env:
          SEC_CONTACTO: ${{ secrets.SEC_CONTACTO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = "15 15-20 * * 1-5" ]; then python main.py vigilar; else python main.py diario; fi

      - name: Guardar los cambios
        run: |
          git config user.name "asistente-inversion"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carteras historico docs
          if git diff --cached --quiet; then echo "Sin cambios que guardar."; exit 0; fi
          git diff --cached --quiet || git commit -m "Actualización $(date -u +%F)"
          # Otra tarea puede haber guardado cambios mientras esta se ejecutaba: se traen antes de subir.
          # Si chocan, se queda la versión de esta ejecución (la más reciente) y se rehace el panel
          # para que incluya las carteras de las dos.
          git pull --rebase -X theirs origin main
          python main.py panel
          git add docs
          git diff --cached --quiet || git commit -m "Panel $(date -u +%F)"
          git push
